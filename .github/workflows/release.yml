name: release

# Tag to release: `git tag v0.1.0 && git push origin v0.1.0`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm trusted publishing and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # release notes are generated from history

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # npm exchanges GitHub's OIDC token for publish credentials. Configure
      # this repository and release.yml as a trusted publisher on npmjs.com.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Trusted publishing requires npm >= 11.5.1; update independently of
      # the version bundled with Node on the runner.
      - name: Install npm with OIDC support
        run: npm install --global npm@11

      - run: bun install --frozen-lockfile

      # A tag is not a promise that the code is good. Run the same gate as CI
      # before anything is published, because npm versions cannot be unpublished
      # after 72 hours.
      - run: bun run check

      # Guard against tagging one version and shipping another — the two are
      # edited in different files and drift silently.
      - name: Check the tag matches package.json
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          packaged="$(node -p 'require("./package.json").version')"
          if [ "$tagged" != "$packaged" ]; then
            echo "Tag $GITHUB_REF_NAME says $tagged but package.json says $packaged." >&2
            exit 1
          fi
          echo "Releasing $packaged"

      # A prerelease must not become the default install. `v0.2.0-rc.1`
      # publishes under `next`; only a plain version takes `latest`.
      - name: Publish to npm with OIDC
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) npm publish --provenance --access public --tag next ;;
            *)   npm publish --provenance --access public ;;
          esac

      - name: Create the GitHub Release
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag --prerelease ;;
            *)   gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag ;;
          esac
        env:
          GH_TOKEN: ${{ github.token }}
