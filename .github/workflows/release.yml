name: release

# Tag to release: `git tag v0.1.0 && git push origin v0.1.0`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes are generated from history

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # npm does the publishing: `bun publish` does not support provenance, and
      # provenance is what lets consumers verify the tarball came from this tag.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      # Fail on credentials before spending a build, and before `npm publish`
      # signs a provenance statement into the public transparency log. npm
      # answers 404 — not 403 — when the token cannot write to the scope, so
      # the error at publish time does not say what is wrong. Say it here.
      - name: Check npm credentials
        run: |
          if ! who="$(npm whoami 2>&1)"; then
            echo "NPM_TOKEN did not authenticate: $who" >&2
            echo "Set the NPM_TOKEN repository secret to a token with publish rights." >&2
            exit 1
          fi
          echo "Authenticated as $who"
          scope="$(node -p 'require("./package.json").name.split("/")[0]')"
          case "$scope" in
            @*)
              org="${scope#@}"
              if ! npm org ls "$org" >/dev/null 2>&1 && [ "$who" != "$org" ]; then
                echo "Cannot publish under $scope: it is neither an org $who belongs to nor $who's own scope." >&2
                echo "Create the '$org' org on npmjs.com and give the token org-wide write access." >&2
                echo "Note: a granular token limited to selected packages cannot create a new package." >&2
                exit 1
              fi
              ;;
          esac
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # A tag is not a promise that the code is good. Run the same gate as CI
      # before anything is published, because npm versions cannot be unpublished
      # after 72 hours.
      - run: bun run check

      # Guard against tagging one version and shipping another — the two are
      # edited in different files and drift silently.
      - name: Check the tag matches package.json
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          packaged="$(node -p 'require("./package.json").version')"
          if [ "$tagged" != "$packaged" ]; then
            echo "Tag $GITHUB_REF_NAME says $tagged but package.json says $packaged." >&2
            exit 1
          fi
          echo "Releasing $packaged"

      # A prerelease must not become the default install. `v0.2.0-rc.1`
      # publishes under `next`; only a plain version takes `latest`.
      - name: Publish to npm
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) npm publish --provenance --access public --tag next ;;
            *)   npm publish --provenance --access public ;;
          esac
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub Release
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag --prerelease ;;
            *)   gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag ;;
          esac
        env:
          GH_TOKEN: ${{ github.token }}
